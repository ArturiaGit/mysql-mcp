name: CI
on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:
    inputs:
      require_frontend:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - name: Commit policy
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-$BEFORE}"
          tip="${PR_HEAD:-$GITHUB_SHA}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            git fetch origin main --quiet
            for commit in $(git rev-list --reverse --no-merges origin/main.."$tip"); do
              git log --format=%B -1 "$commit" | pnpm exec commitlint --verbose
            done
          else
            pnpm exec commitlint --from "$base" --to "$tip" --verbose
          fi
      - run: python scripts/generate_readiness_contracts.py --check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:guardrails
      - run: pnpm test
      - run: pnpm --filter @mysql-mcp/admin-ui test
      - name: Set ephemeral database credentials
        run: |
          root_password=$(openssl rand -hex 32)
          app_password=$(openssl rand -hex 32)
          echo "::add-mask::$root_password"
          echo "::add-mask::$app_password"
          {
            echo "MYSQL_ROOT_PASSWORD=$root_password"
            echo "METADATA_DB_PASSWORD=$app_password"
            echo 'METADATA_DB_USER=m0_integration'
            echo 'METADATA_DB_PORT=13306'
          } >> "$GITHUB_ENV"
      - run: node scripts/m0/mysql-up.mjs
      - run: pnpm test:integration
      - run: pnpm test:m1
      # The backend suite leaves a dirty PENDING fixture. Browser suites each bootstrap their own database.
      - name: Reset MySQL before frontend verification
        run: docker compose down --volumes && node scripts/m0/mysql-up.mjs
      - name: Frontend build, gzip budget and browser E2E
        env:
          REQUIRE_FRONTEND: ${{ inputs.require_frontend || github.ref_name == 'main' || github.base_ref == 'main' }}
        run: |
          if [[ "$REQUIRE_FRONTEND" == true ]]; then
            pnpm --filter @mysql-mcp/admin-ui build
            pnpm --filter @mysql-mcp/admin-ui test:e2e:m1
            docker compose down --volumes && node scripts/m0/mysql-up.mjs
            pnpm ci:frontend --require-frontend
          else
            pnpm ci:frontend
          fi
      - name: Dispose of ephemeral MySQL
        if: ${{ always() && env.METADATA_DB_USER != '' }}
        run: docker compose down --volumes
